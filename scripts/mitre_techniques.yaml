# Tabela tecnica -> taticas MITRE (R16, Phase 18) - dados VERSIONADOS, so leitura.
#
# Fixada no MITRE ATT&CK Enterprise v18.1: a ultima versao com as 14 taticas
# Enterprise, incluindo "Defense Evasion" (a v19+ trocou-a por "Stealth" e
# acrescentou "Defense Impairment"). "Defense Evasion" e tambem o vocabulario que
# o Wazuh do laboratorio envia em rule.mitre.tactic. Mudar de versao e uma
# decisao nova, nao um ajuste a este ficheiro.
#
# Formato: lista de entradas {id, name, tactics}. Campos obrigatorios, contrato
# fechado (um campo desconhecido, p. ex. "tactic:" em vez de "tactics:", e erro):
#   id      - Txxxx ou Txxxx.xxx
#   name    - nome da tecnica (texto, ate 128 caracteres)
#   tactics - lista NAO vazia, sem repeticoes, das 14 taticas Enterprise; e a
#             lista COMPLETA da tecnica (nunca uma "tatica principal").
# Uma lista (e nao um mapa) para que um id repetido nao seja engolido em silencio.
#
# A tatica de um alerta e de um ataque vem SEMPRE daqui. Uma sub-tecnica sem
# entrada propria herda as taticas do pai (Txxxx). Uma tecnica sem entrada nem
# pai fica sem tatica (lista vazia), nunca inventada.
#
# O validador (mitre_catalog.py) bloqueia o arranque do backend se esta tabela
# for invalida ou se faltar uma tecnica declarada em attack_scenarios.SCENARIOS
# ou em event_catalog.CRITICAL_EVENTS. Acrescentar uma tecnica aqui exige tambem
# mudar a lista literal EXPECTED_TABLE em test_mitre_catalog.py.

